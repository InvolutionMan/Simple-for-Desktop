<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBFAF8">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("simple.theme");
        var theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#0F1214" : "#FBFAF8");
      } catch (error) {}
    })();
  </script>
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Simple 网页版：单纯交个朋友。关注、广场、夜市与慢信。">
  <title>Simple · 单纯交个朋友</title>
  <link rel="icon" href="/favicon.svg?v=20261101bf" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=20261101bf">
  <link rel="stylesheet" href="/css/theme.css?v=20261101bf">
  <link rel="stylesheet" href="/css/messages.css?v=20261101bf">
  <link rel="stylesheet" href="/css/channels.css?v=20261101bf">
</head>
<body>
  <div id="app" class="app"></div>
  <div id="overlay-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript>
    <div class="noscript">请开启 JavaScript 后再使用 Simple 网页版。</div>
  </noscript>
  <script type="module" src="/js/app.js?v=20261101bf"></script>
</body>
</html>
